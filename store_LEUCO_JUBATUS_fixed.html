/* ===== Barcode: labels (print + PDF), barcode list, camera scanning, scan history ===== */
var QR=null,SCL="",SCT=0,SLOG=[];
const BCJS="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js";
const SCANJS="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js";
const LIBS={};
function loadScript(u){return LIBS[u]||(LIBS[u]=new Promise((res,rej)=>{const s=document.createElement("script");s.src=u;s.onload=res;s.onerror=()=>{delete LIBS[u];rej(new Error("load"))};document.head.appendChild(s)}))}
const PAP={a4:{name:"A4 sheet, 3 per row (63 × 38 mm)",pw:210,ph:297,w:63,h:38,cols:3,m:8},
  stk50:{name:"Sticker 50 × 30 mm (4 per row)",pw:210,ph:297,w:50,h:30,cols:4,m:5},
  sm38:{name:"Small 38 × 25 mm (5 per row)",pw:210,ph:297,w:38,h:25,cols:5,m:6}};
function ensureBC(){S.bcn=S.bcn||1000;let ch=false;S.products.forEach(p=>p.v.forEach(v=>{if(!v.bc){S.bcn++;v.bc="LJ"+S.bcn;ch=true}}));if(ch)save()}
function findBC(c){for(const p of S.products){const j=p.v.findIndex(v=>v.bc==c);if(j>-1)return{p,j,v:p.v[j]}}return null}
function bopt(){const g=id=>document.getElementById(id);return{pap:g("bpap")?g("bpap").value:"stk50",pr:g("bpr")?g("bpr").checked:true,st:g("bst")?g("bst").checked:true,vc:g("bvc")?g("bvc").checked:true,sel:g("bcp")?g("bcp").value:"all",n:Math.max(1,Math.min(200,+(g("bcc")?g("bcc").value:1)||1))}}
function labelList(o){const out=[];S.products.filter(p=>o.sel=="all"||o.sel=="low"||p.id==o.sel).forEach(p=>p.v.forEach(v=>{if(o.sel=="low"&&v.q>S.low)return;for(let k=0;k<o.n;k++)out.push({p,v})}));return out}
function labelHTML(it,o,P){const {p,v}=it,sh=S.shop||{name:"LEUCO JUBATUS"};
  return`<div style="width:${P.w}mm;height:${P.h}mm;overflow:hidden;box-sizing:border-box;padding:1.5mm;background:#fff;color:#000;text-align:center;font-family:Helvetica,Arial,sans-serif"><div style="font-weight:700;font-size:${P.w<45?"7":"9"}px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.name)}</div>${o.vc?`<div style="font-size:${P.w<45?"6":"8"}px">${esc(v.s)} / ${esc(v.c)}</div>`:""}${o.pr?`<div style="font-size:${P.w<45?"6":"8"}px">${rs(p.price)}</div>`:""}${o.st?`<div style="font-size:${P.w<45?"5":"7"}px">${esc(sh.name)}</div>`:""}<svg data-bc="${esc(v.bc)}" style="width:100%;height:${Math.max(8,P.h-(o.pr?0:0)-16)}mm;max-height:${P.h*0.6}mm"></svg></div>`}
function setPageCSS(P){let s=document.getElementById("lbpage");if(!s){s=document.createElement("style");s.id="lbpage";document.head.appendChild(s)}s.textContent=`@page{size:${P.pw}mm ${P.ph}mm;margin:${P.m}mm}@media print{#bclabels{display:grid!important;grid-template-columns:repeat(${P.cols},${P.w}mm)!important;gap:0!important;margin:0!important}#bclabels>div{break-inside:avoid}}`}
function clearPageCSS(){const s=document.getElementById("lbpage");if(s)s.remove()}
function bcMake(){ensureBC();const o=bopt(),P=PAP[o.pap],L=labelList(o);
  if(!L.length)return toast(o.sel=="low"?"No products are low on stock":"No products to make labels for yet");
  const g=document.getElementById("bclabels");g.style.gridTemplateColumns="repeat("+P.cols+","+P.w+"mm)";g.style.gap="2mm";
  g.innerHTML=L.map(it=>labelHTML(it,o,P)).join("");setPageCSS(P);bcDraw();
  document.getElementById("bcmsg").textContent=L.length+" label(s) ready. Press Print labels to print.";}
async function bcDraw(){
  if(!window.JsBarcode){try{await loadScript(BCJS)}catch(e){return toast("Could not load the barcode tool. Check your internet connection.")}}
  document.querySelectorAll("svg[data-bc]").forEach(s=>{try{JsBarcode(s,s.dataset.bc,{format:"CODE128",width:2,height:50,fontSize:14,margin:2,displayValue:true})}catch(e){}})}
function bcPrint(){const o=bopt(),P=PAP[o.pap];if(!document.querySelector("#bclabels svg[data-bc]"))bcMake();
  if(!document.querySelector("#bclabels svg[data-bc]"))return;setPageCSS(P);
  window.onafterprint=()=>{clearPageCSS();window.onafterprint=null};window.print();setTimeout(clearPageCSS,1500)}
const BARIMG={};
async function barImg(code){if(BARIMG[code])return BARIMG[code];
  const c=document.createElement("canvas");JsBarcode(c,code,{format:"CODE128",width:3,height:90,fontSize:22,margin:4,displayValue:true});
  return BARIMG[code]={url:c.toDataURL("image/png"),ar:c.width/c.height}}
function drawLabel(d,it,x,y,P,o,sh){const {p,v}=it,small=P.w<45,fs=small?5.5:7,lh=small?2.5:3.2;let ty=y+3.6;
  d.setTextColor(0);d.setFont("helvetica","bold");d.setFontSize(fs);d.text(String(p.name).slice(0,small?16:26),x+P.w/2,ty,{align:"center"});ty+=lh;
  d.setFont("helvetica","normal");d.setFontSize(fs-1);
  if(o.vc){d.text(v.s+" / "+v.c,x+P.w/2,ty,{align:"center"});ty+=lh}
  if(o.pr){d.text("Rs. "+Number(p.price).toLocaleString("en-US"),x+P.w/2,ty,{align:"center"});ty+=lh}
  if(o.st){d.setFontSize(fs-2);d.text(String(sh.name),x+P.w/2,ty,{align:"center"});ty+=lh}
  return {ty}}
async function labelsPdf(){
  if(!window.jspdf)return toast("The PDF tool is still loading. Try again in a moment.");
  if(!window.JsBarcode){try{await loadScript(BCJS)}catch(e){return toast("Could not load the barcode tool. Check your internet connection.")}}
  ensureBC();const o=bopt(),P=PAP[o.pap],L=labelList(o),sh=S.shop||{name:"LEUCO JUBATUS"};
  if(!L.length)return toast("No products to make labels for yet");
  const {jsPDF}=window.jspdf,d=new jsPDF({unit:"mm",format:"a4"}),rows=Math.floor((P.ph-2*P.m)/P.h),per=P.cols*rows;
  for(let i=0;i<L.length;i++){
    if(i>0&&i%per==0)d.addPage();
    const idx=i%per,x=P.m+(idx%P.cols)*P.w,y=P.m+Math.floor(idx/P.cols)*P.h;
    const it=L[i],{ty}=drawLabel(d,it,x,y,P,o,sh),bi=await barImg(it.v.bc);
    const avail=y+P.h-ty-1.5,aw=P.w-5;let iw=aw,ih=aw/bi.ar;if(ih>avail){ih=avail;iw=ih*bi.ar}
    d.addImage(bi.url,"PNG",x+(P.w-iw)/2,ty+0.5,iw,ih);
  }
  d.save("barcode-labels-"+lgToday()+".pdf")}
function barcodeCsv(){ensureBC();let c="Barcode,Product,Size,Colour,Price (Rs.),Stock\n";
  S.products.forEach(p=>p.v.forEach(v=>{c+=[v.bc,p.name,v.s,v.c,p.price,v.q].map(csvc).join(",")+"\n"}));
  dl("barcode-list-"+lgToday()+".csv","\ufeff"+c);toast("Barcode list downloaded")}
async function scanStart(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return toast("This browser cannot use the camera. Open the store link in Chrome or Safari.");
  try{await loadScript(SCANJS)}catch(e){return toast("Could not load the scanner. Check your internet connection.")}
  if(QR)await scanStop();
  try{
    QR=new Html5Qrcode("lj-reader",{formatsToSupport:[Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.CODE_39],verbose:false});
    await QR.start({facingMode:"environment"},{fps:10,qrbox:(w,h)=>({width:Math.min(320,Math.floor(w*0.9)),height:Math.min(150,Math.floor(h*0.45))})},code=>scanFound(code),()=>{});
    document.getElementById("scmsg").textContent="Camera on. Point it at a barcode.";
  }catch(e){QR=null;toast("Camera could not start. Allow camera access in your browser settings and use the https store link.")}}
async function scanStop(){if(!QR)return;const q=QR;QR=null;try{if(q.isScanning)await q.stop();q.clear()}catch(e){}}
function scanFound(code){const now=Date.now();if(code==SCL&&now-SCT<2500)return;SCL=code;SCT=now;
  if(navigator.vibrate)navigator.vibrate(80);
  if(QR)try{QR.pause(true)}catch(e){}
  scanLookup(code)}
function scanResume(){SCL="";if(QR)try{QR.resume()}catch(e){}const r=document.getElementById("scres");if(r)r.innerHTML="";const m=document.getElementById("scmsg");if(m)m.textContent="Camera on. Point it at a barcode."}
function scanLookup(raw){const code=String(raw||"").trim().toUpperCase();const el=document.getElementById("scres");if(!el)return;
  const hit=findBC(code);
  if(!hit){el.innerHTML=`<div class="card" style="margin-top:12px"><b>Not found:</b> ${esc(code)}<p class="mut">No product has this barcode. Make labels first, or check the code.</p>${QR?'<button class="btn sm" onclick="scanResume()">Scan next</button>':""}</div>`;return}
  const {p,j,v}=hit,inCart=cart.filter(c=>c.id==p.id&&c.j==j).reduce((a,c)=>a+c.n,0);
  SLOG.unshift({t:new Date().toLocaleTimeString(),code,name:p.name,s:v.s,c:v.c});if(SLOG.length>30)SLOG.pop();renderHist();
  el.innerHTML=`<div class="card" style="margin-top:12px"><h3>${esc(p.name)}</h3><p class="mut">${esc(v.s)} / ${esc(v.c)} · ${rs(p.price)} · Stock ${v.q}${inCart?" · In sale cart: "+inCart:""}</p>
  <div class="row"><button class="btn" onclick="scanStock(${p.id},${j})">+1 stock</button><button class="btn alt" onclick="scanSale(${p.id},${j})">Add to quick sale</button>${QR?'<button class="btn alt" onclick="scanResume()">Scan next</button>':""}</div></div>`}
function renderHist(){const h=document.getElementById("schist");if(!h)return;
  h.innerHTML=SLOG.length?`<div class="row" style="margin-top:12px"><b style="flex:1">Scan history (this session)</b><button class="btn alt sm" onclick="SLOG=[];renderHist()">Clear</button></div>`+SLOG.map(x=>`<div class="row" style="border-top:1px solid var(--line);padding:6px 0"><span class="mut" style="width:80px">${x.t}</span><span style="flex:1">${esc(x.name)} <span class="mut">${esc(x.s)}/${esc(x.c)}</span></span><button class="btn alt sm" onclick="scanLookup('${x.code}')">Open</button></div>`).join(""):'<p class="mut" style="margin-top:10px">Scanned items appear here.</p>'}
function scanStock(id,j){const p=S.products.find(x=>x.id==id);if(!p||!p.v[j])return;p.v[j].q++;save();toast("Stock +1: "+p.name+" "+p.v[j].s+" / "+p.v[j].c+" now "+p.v[j].q);scanLookup(p.v[j].bc)}
function scanSale(id,j){const p=S.products.find(x=>x.id==id);if(!p||!p.v[j])return;const v=p.v[j],ex=cart.find(c=>c.id==id&&c.j==j),n=(ex?ex.n:0)+1;
  if(n>v.q)return toast("No stock left for "+v.s+" / "+v.c);
  ex?ex.n++:cart.push({id,j,name:p.name,price:p.price,s:v.s,c:v.c,n:1});
  toast("Added to quick sale. Open Quick sale to bill.");scanLookup(v.bc)}
V.barcode=function(){
  setTimeout(()=>{ensureBC();renderHist()},0);
  const opts=S.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("");
  const paps=Object.entries(PAP).map(([k,v])=>`<option value="${k}" ${k=="stk50"?"selected":""}>${v.name}</option>`).join("");
  return`<div class="two"><div class="card"><h2>1. Barcode labels</h2><p class="mut">Each size and colour gets its own barcode. Choose the paper, what to show on each label, then print or download a PDF.</p>
  <div class="row noprint"><select id="bcp"><option value="all">All products</option><option value="low">Low stock only</option>${opts}</select><label class="mut">Copies each <input id="bcc" type="number" min="1" max="200" value="1" style="width:80px"></label></div>
  <div class="row noprint"><select id="bpap">${paps}</select></div>
  <div class="row noprint"><label><input type="checkbox" id="bpr" checked> Price</label><label><input type="checkbox" id="bst" checked> Store name</label><label><input type="checkbox" id="bvc" checked> Size / colour</label></div>
  <div class="row noprint"><button class="btn" onclick="bcMake()">Show labels</button><button class="btn alt" onclick="bcPrint()">Print labels</button><button class="btn alt" onclick="labelsPdf()">Download labels PDF</button><button class="btn alt" onclick="barcodeCsv()">Barcode list (CSV)</button></div>
  <p class="mut noprint" id="bcmsg" style="margin:0 0 8px"></p>
  <div id="bclabels" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:6px"><p class="mut">Choose products and press Show labels.</p></div></div>
  <div class="card noprint"><h2>2. Scan with camera</h2><p class="mut">Point the phone camera at a barcode. Allow camera access when asked. Needs the store opened over https (the published link).</p>
  <div class="row"><button class="btn" onclick="scanStart()">Open camera</button><button class="btn alt" onclick="scanStop().then(()=>{document.getElementById('scmsg').textContent='Camera off.'})">Stop camera</button></div>
  <div id="lj-reader" style="width:100%;max-width:420px;border-radius:12px;overflow:hidden"></div>
  <p class="mut" id="scmsg" style="margin:6px 0 0">Camera off.</p>
  <div class="row" style="margin-top:8px"><input id="bcm" placeholder="Or type a barcode, e.g. LJ1001" style="flex:1;min-width:160px" onkeydown="if(event.key=='Enter')scanLookup(this.value)"><button class="btn sm" onclick="scanLookup(document.getElementById('bcm').value)">Find</button></div>
  <div id="scres"></div><div id="schist"></div></div></div>`};
/* Customers: full contact details */
let editC=0,CQ="";
function custList(){const q=CQ.toLowerCase();return S.customers.filter(c=>(TAGF=="all"||(c.tags||[]).includes(TAGF))&&(!q||[c.name,c.phone,c.email,c.addr,c.note].join(" ").toLowerCase().includes(q)))}
function custTable(){const L=custList();if(!L.length)return '<p class="mut">No customers found.</p>';
 return '<table><tr><th>Name</th><th>Contact details</th><th>Tags</th><th>Orders</th><th>Spent</th><th>Points</th><th></th></tr>'+L.map(c=>{
  const os=S.orders.filter(o=>o.cid==c.id);const ly=loyOf(c);
  const tags=(c.tags||[]).map(t=>'<span class="tag acc">'+esc(t)+'</span>').join(" ");
  const wa=c.phone?'<a class="btn alt sm" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/'+waNum(c.phone)+'">WhatsApp</a>':"";
  const call=c.phone?'<a class="btn alt sm" style="text-decoration:none" href="tel:'+esc(c.phone)+'">Call</a>':"";
  return '<tr><td><b>'+esc(c.name)+'</b>'+(c.note?'<br><span class="mut">'+esc(c.note)+'</span>':'')+'</td><td class="mut">'+esc(c.phone||"")+'<br>'+esc(c.email||"")+'<br>'+esc(c.addr||"")+'</td><td>'+tags+'</td><td>'+os.length+'</td><td>'+rs(os.filter(live).reduce((x,o)=>x+o.total,0))+'</td><td>'+ly.bal+'</td><td><div class="row" style="margin:0"><button class="btn alt sm" onclick="editCust('+c.id+')">Edit</button><button class="btn alt sm" onclick="openHist('+c.id+')">History</button><button class="btn alt sm" onclick="custSurvey('+c.id+')">Fit survey</button>'+wa+call+'<button class="btn alt sm" onclick="delCust('+c.id+')">Delete</button></div></td></tr>';
 }).join("")+'</table>';}
function searchCust(v){CQ=v;document.getElementById("ctab").innerHTML=custTable()}
function editCust(id){editC=id;render();scrollTo(0,0)}
function delCust(id){const c=S.customers.find(x=>x.id==id);if(c&&confirm("Delete "+c.name+"? Their past orders stay in Orders.")){S.customers=S.customers.filter(x=>x.id!=id);save();toast("Customer deleted");render()}}
addCust=function(){const g=i=>document.getElementById(i).value.trim();if(!g("kn")||!g("kp"))return toast("Enter a name and phone number");
 const o={name:g("kn"),phone:g("kp"),email:g("ke"),addr:g("ka"),note:g("kt"),tags:[...document.querySelectorAll('input[name="ktag"]:checked')].map(x=>x.value)};
 const dup=S.customers.find(x=>x.phone==o.phone&&x.id!=editC);if(dup)return toast("This phone number is already saved for "+dup.name);
 if(editC){Object.assign(S.customers.find(x=>x.id==editC),o)}else S.customers.push(Object.assign({id:S.cid++},o));
 editC=0;save();toast("Customer saved");render()};
function custCsv(){let c="Name,Phone,Email,Address,Notes,Orders,Spent\n";S.customers.forEach(x=>{const os=S.orders.filter(o=>o.cid==x.id);c+=[x.name,x.phone,x.email,x.addr,x.note,os.length,os.filter(live).reduce((a,o)=>a+o.total,0)].map(csvc).join(",")+"\n"});dl("customers-"+dkey(Date.now())+".csv","\ufeff"+c);toast("Customer list downloaded")}
V.cust=function(){const e=editC&&S.customers.find(x=>x.id==editC)||{};
 return`<div class="card"><h3>${e.id?"Edit customer":"Save customer contact details"}</h3><div class="row"><input id="kn" placeholder="Name *" value="${esc(e.name||"")}"><input id="kp" placeholder="Phone / WhatsApp *" value="${esc(e.phone||"")}"><input id="ke" type="email" placeholder="Email" value="${esc(e.email||"")}"></div><div class="row"><input id="ka" placeholder="Address" value="${esc(e.addr||"")}" style="flex:1;min-width:220px"><input id="kt" placeholder="Note (size, likes...)" value="${esc(e.note||"")}" style="flex:1;min-width:180px"></div>${tagRow(e)}<div class="row"><button class="btn" onclick="addCust()">${e.id?"Update customer":"Save customer"}</button>${e.id?'<button class="btn alt" onclick="editC=0;render()">Cancel</button>':""}</div><p class="mut">Customers who place an order are saved here automatically.</p></div>
 <div class="card scroll"><div class="row"><h3 style="margin:0;flex:1">Customers (${S.customers.length})</h3>${tagSel()}<input placeholder="Search name, phone, email" value="${esc(CQ)}" oninput="searchCust(this.value)"><button class="btn alt sm" onclick="custCsv()">Download list (CSV)</button></div><div id="ctab">${custTable()}</div></div>`};

/* ===== Person reports: one report per person, built from Notes & Money records ===== */
var PR={q:"",view:"",sel:[]};
var prepSig="";
const pKey=n=>String(n||"").trim().toLowerCase();
const ek=k=>encodeURIComponent(k).replace(/'/g,"%27");
const pSgn=b=>(b<0?"-":"")+rs(Math.abs(b));
const pStatus=b=>b>0?"Given more":b<0?"Received more":"Settled";
function pSig(){return JSON.stringify([S.money,S.givenOut])}
function prepPeople(){
  const map={};
  const add=(name,t)=>{const n=String(name||"").trim();if(!n)return;const k=pKey(n);if(!map[k])map[k]={key:k,name:n,tx:[]};map[k].tx.push(t)};
  (S.money||[]).forEach(m=>add(m.name,{id:String(m.id),date:m.date||"",type:m.type==="received"?"received":"given",amount:+m.amount||0,reason:m.reason||"",src:"Money record"}));
  (S.givenOut||[]).forEach(g=>add(g.to,{id:String(g.id),date:g.date||"",type:"given",amount:+g.amount||0,reason:g.note||"",src:"Given to"}));
  return Object.values(map).map(p=>{
    p.tx.sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));
    let run=0;p.tx.forEach(t=>{run+=t.type==="given"?t.amount:-t.amount;t.bal=run});
    p.given=p.tx.filter(t=>t.type==="given").reduce((a,t)=>a+t.amount,0);
    p.received=p.tx.filter(t=>t.type==="received").reduce((a,t)=>a+t.amount,0);
    p.balance=p.given-p.received;
    p.last=p.tx.length?p.tx[p.tx.length-1].date:"";
    return p;
  }).sort((a,b)=>a.name.localeCompare(b.name));
}
function prepList(){const q=pKey(PR.q);return prepPeople().filter(p=>!q||p.name.toLowerCase().includes(q))}
function prepTable(p){
  return `<div class="scroll"><table><tr><th>Date</th><th>Type</th><th>Reason</th><th>Amount</th><th>Balance</th></tr>${p.tx.map(t=>`<tr><td>${esc(t.date||"-")}</td><td><span class="tag ${t.type=="given"?"bad":"ok"}">${t.type=="given"?"Given":"Received"}</span></td><td>${esc(t.reason||"")}${t.src=="Given to"?'<br><span class="mut">Given-to record</span>':""}</td><td>${rs(t.amount)}</td><td>${pSgn(t.bal)}</td></tr>`).join("")}</table></div>`;
}
function pStats(p){
  return `<div class="stats" style="margin:12px 0"><div class="stat"><span class="mut">Transactions</span><b>${p.tx.length}</b></div><div class="stat"><span class="mut">Given</span><b>${rs(p.given)}</b></div><div class="stat"><span class="mut">Received</span><b>${rs(p.received)}</b></div><div class="stat"><span class="mut">Balance</span><b>${pSgn(p.balance)}</b><span class="mut">${pStatus(p.balance)}</span></div></div>`;
}
function prepCards(L){
  if(!L.length)return '<p class="mut">No people found.</p>';
  return `<div class="grid">${L.map(p=>{const k=ek(p.key),on=PR.sel.includes(p.key);return `<div class="card" style="margin:0;display:flex;flex-direction:column;gap:6px">
    <div class="row" style="margin:0;justify-content:space-between;flex-wrap:nowrap"><label class="row" style="margin:0;gap:8px;min-width:0;cursor:pointer"><input type="checkbox" style="width:18px;height:18px;flex:none" ${on?"checked":""} onchange="prepTog('${k}',this.checked)"><b style="overflow-wrap:anywhere">${esc(p.name)}</b></label><span class="tag">${p.tx.length} transaction${p.tx.length==1?"":"s"}</span></div>
    <div class="mut">Last activity: ${esc(p.last||"-")}</div>
    <div class="row" style="margin:0;gap:14px"><span>Given <b>${rs(p.given)}</b></span><span>Received <b>${rs(p.received)}</b></span></div>
    <div><span class="tag acc">Balance ${pSgn(p.balance)} · ${pStatus(p.balance)}</span></div>
    <div class="row" style="margin:6px 0 0"><button class="btn sm" onclick="prepView('${k}')">View report</button><button class="btn alt sm" onclick="prepPdf('one','${k}')">Download PDF</button></div>
  </div>`}).join("")}</div>`;
}
V.prep=function(){
  const all=prepPeople();
  PR.sel=PR.sel.filter(k=>all.some(p=>p.key==k));
  const view=all.find(p=>p.key==PR.view);
  if(PR.view&&!view)PR.view="";
  prepSig=pSig();
  const tg=all.reduce((a,p)=>a+p.given,0),tr=all.reduce((a,p)=>a+p.received,0);
  const rep=view?`<div class="card" id="prep-rep"><div class="row" style="justify-content:space-between;margin-bottom:0"><h2 style="margin:0">Report: ${esc(view.name)}</h2><button class="btn alt sm" onclick="prepClose()">Close</button></div>
    <p class="mut" style="margin:8px 0 0">Transactions in date order. Balance after each row = total given minus total received so far.</p>
    ${pStats(view)}${prepTable(view)}
    <div class="row" style="margin-top:12px"><button class="btn" onclick="prepPdf('one','${ek(view.key)}')">Download PDF</button></div></div>`:"";
  return `<div class="card"><h2>Person reports</h2>
    <p class="mut">One report per person, built from your Notes &amp; Money records (money given or received, and Given to records). Reports update automatically when data changes.</p>
    <div class="stats" style="margin:12px 0"><div class="stat"><span class="mut">People</span><b>${all.length}</b></div><div class="stat"><span class="mut">Total given</span><b>${rs(tg)}</b></div><div class="stat"><span class="mut">Total received</span><b>${rs(tr)}</b></div></div>
    <div class="row"><input placeholder="Search by name" value="${esc(PR.q)}" oninput="prepSearch(this.value)" aria-label="Search people" style="flex:1;min-width:180px"></div>
    <div class="row"><button class="btn alt sm" onclick="prepSelAll()">Select all shown</button><button class="btn alt sm" onclick="prepSelNone()">Clear selection</button><span class="mut">${PR.sel.length} selected</span></div>
    <div class="row"><button class="btn" onclick="prepPdf('sel')" ${PR.sel.length?"":"disabled"}>Download selected PDF</button><button class="btn" onclick="prepPdf('all')" ${all.length?"":"disabled"}>Download all reports PDF</button></div>
  </div>
  ${rep}
  <div class="card"><h2>People</h2><div id="prep-list">${prepCards(prepList())}</div></div>`;
};
function prepView(k){PR.view=decodeURIComponent(k);render();setTimeout(()=>{const e=document.getElementById("prep-rep");if(e)e.scrollIntoView({behavior:"smooth",block:"start"})},50)}
function prepClose(){PR.view="";render()}
function prepTog(k,on){const key=decodeURIComponent(k);PR.sel=on?[...new Set([...PR.sel,key])]:PR.sel.filter(x=>x!=key);render()}
function prepSearch(v){PR.q=v;const el=document.getElementById("prep-list");if(el)el.innerHTML=prepCards(prepList())}
function prepSelAll(){PR.sel=prepList().map(p=>p.key);render()}
function prepSelNone(){PR.sel=[];render()}
function prepSync(){if(mode!="admin"||!authed||tab!="prep")return;if(pSig()!==prepSig)render()}
function prepPdf(which,k){
  if(!window.jspdf)return toast("The PDF tool is still loading. Try again in a moment.");
  const all=prepPeople();
  const L=which=="all"?all:which=="one"?all.filter(p=>p.key==decodeURIComponent(k)):all.filter(p=>PR.sel.includes(p.key));
  if(!L.length)return toast(which=="sel"?"Select at least one person first":"No person to download");
  const {jsPDF}=window.jspdf,d=new jsPDF({unit:"mm",format:"a4"}),sh=S.shop||{name:"LEUCO JUBATUS"};
  const mon=n=>"Rs. "+Number(n).toLocaleString("en-US"),msg=n=>(n<0?"-":"")+mon(Math.abs(n));
  const stamp=new Date().toLocaleString();
  let y=0,title="",first=true,redraw=null;
  const top=()=>{d.setFont("helvetica","bold");d.setFontSize(15);d.setTextColor(20);d.text(title,15,18);d.setFont("helvetica","normal");d.setFontSize(9.5);d.setTextColor(90);d.text(sh.name+"   |   Created "+stamp,15,25);y=36};
  const page=t=>{title=t;if(!first)d.addPage();first=false;top()};
  const chk=h=>{if(y+h>280){d.addPage();top();if(redraw)redraw()}};
  const head=cols=>{d.setFont("helvetica","bold");d.setFontSize(9.5);d.setTextColor(20);cols.forEach(c=>d.text(c[1],c[0],y,c[2]?{align:c[2]}:undefined));y+=2;d.setDrawColor(190);d.line(15,y,195,y);y+=5;d.setFont("helvetica","normal")};
  const txHead=()=>head([[15,"Date"],[42,"Type"],[68,"Reason"],[150,"Amount","right"],[195,"Balance","right"]]);
  const txRow=t=>{const rr=d.splitTextToSize(String(t.reason||"-")+(t.src=="Given to"?" (given-to record)":""),62),h=Math.max(rr.length,1)*4.8+2.5;chk(h);d.setFontSize(9.5);d.setTextColor(20);d.text(String(t.date||"-"),15,y);d.text(t.type=="given"?"Given":"Received",42,y);d.text(rr,68,y);d.text(mon(t.amount),150,y,{align:"right"});d.text(msg(t.bal),195,y,{align:"right"});y+=h};
  if(L.length>1){
    page("Summary: person reports");
    head([[15,"Name"],[95,"Transactions","right"],[130,"Given","right"],[160,"Received","right"],[195,"Balance","right"]]);
    L.forEach(p=>{chk(6);d.setFontSize(9.5);d.setTextColor(20);d.text(p.name.slice(0,30),15,y);d.text(String(p.tx.length),95,y,{align:"right"});d.text(mon(p.given),130,y,{align:"right"});d.text(mon(p.received),160,y,{align:"right"});d.text(msg(p.balance),195,y,{align:"right"});y+=6});
    const tg=L.reduce((a,p)=>a+p.given,0),tr=L.reduce((a,p)=>a+p.received,0);
    y+=2;d.setFont("helvetica","bold");d.text("Totals",15,y);d.text(mon(tg),130,y,{align:"right"});d.text(mon(tr),160,y,{align:"right"});d.text(msg(tg-tr),195,y,{align:"right"});
  }
  L.forEach(p=>{
    page("Person report: "+p.name);
    d.setFontSize(10);d.setTextColor(20);d.setFont("helvetica","normal");
    d.text("Transactions: "+p.tx.length+"     Given: "+mon(p.given)+"     Received: "+mon(p.received),15,y);y+=6;
    d.setFont("helvetica","bold");d.text("Balance: "+msg(p.balance)+"  ("+pStatus(p.balance)+")",15,y);y+=5;
    d.setFont("helvetica","normal");d.setFontSize(8.5);d.setTextColor(90);d.text("Balance after each row = total given minus total received so far.",15,y);y+=7;
    redraw=txHead;txHead();
    if(!p.tx.length){d.setTextColor(90);d.text("No transactions.",15,y);y+=6}
    p.tx.forEach(txRow);
    y+=4;
  });
  const nm=which=="all"?"all-person-reports":which=="sel"?"selected-person-reports":"person-report-"+L[0].key.replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  d.save(nm+"-"+dkey(Date.now())+".pdf");toast("PDF downloaded");
}

/* ===== Supplier reports: supplier invoices and product details ===== */
var SP={q:"",view:"",sel:[],form:null};
var suppSig="";
const spKey=n=>String(n||"").trim().toLowerCase();
const spSig=()=>JSON.stringify(S.purchases||[]);
const spNewItem=()=>({name:"",s:"",c:"",q:"",cost:""});
function spFormGet(){if(!SP.form)SP.form={sup:"",inv:"",date:"",paid:"",items:[spNewItem()]};return SP.form}
function spReadForm(){
  const f=SP.form;if(!f)return;
  const g=id=>{const e=document.getElementById(id);return e?e.value:null};
  if(g("sp_sup")===null)return;
  f.sup=g("sp_sup");f.inv=g("sp_inv");f.date=g("sp_dt");f.paid=g("sp_paid");
  f.items=f.items.map((it,i)=>({name:g("sp_n"+i)??it.name,s:g("sp_s"+i)??it.s,c:g("sp_c"+i)??it.c,q:g("sp_q"+i)??it.q,cost:g("sp_k"+i)??it.cost}));
}
function spAddItem(){spReadForm();spFormGet().items.push(spNewItem());render()}
function spRemItem(i){spReadForm();const f=spFormGet();if(f.items.length>1)f.items.splice(i,1);render()}
function spSave(){
  spReadForm();const f=spFormGet(),sup=String(f.sup||"").trim();
  if(!sup)return toast("Enter the supplier name");
  const items=f.items.map(it=>({name:String(it.name||"").trim(),s:String(it.s||"").trim(),c:String(it.c||"").trim(),q:+it.q||0,cost:+it.cost||0})).filter(it=>it.name||it.q||it.cost);
  if(!items.length)return toast("Add at least one product");
  if(items.some(it=>!it.name))return toast("Every product needs a name");
  if(items.some(it=>!(it.q>0)))return toast("Every product needs a quantity greater than 0");
  if(items.some(it=>it.cost<0))return toast("Unit cost cannot be negative");
  const total=items.reduce((a,it)=>a+it.q*it.cost,0),paid=+f.paid||0;
  if(paid<0)return toast("Paid amount cannot be negative");
  if(paid>total)return toast("Paid amount cannot be more than the invoice total");
  S.purchases=S.purchases||[];
  S.purchases.push({id:"p"+Date.now(),sup,inv:String(f.inv||"").trim(),date:f.date||dkey(Date.now()),items,paid});
  SP.form=null;save();toast("Invoice saved");render();
}
function spDel(id){
  const p=(S.purchases||[]).find(x=>x.id==id);if(!p)return;
  if(!confirm("Delete invoice "+(p.inv||"(no number)")+" from "+p.sup+"?"))return;
  S.purchases=S.purchases.filter(x=>x.id!=id);save();toast("Invoice deleted");render();
}
function spPeople(){
  const map={};
  (S.purchases||[]).forEach(p=>{const n=String(p.sup||"").trim();if(!n)return;const k=spKey(n);if(!map[k])map[k]={key:k,name:n,list:[]};map[k].list.push(p)});
  return Object.values(map).map(s=>{
    const sorted=[...s.list].sort((a,b)=>String(a.date).localeCompare(String(b.date))||String(a.id).localeCompare(String(b.id)));
    let run=0;
    s.list=sorted.map(p=>{const total=p.items.reduce((a,it)=>a+it.q*it.cost,0),paid=+p.paid||0;run+=total-paid;return {...p,total,paid,bal:run}});
    s.total=s.list.reduce((a,p)=>a+p.total,0);
    s.paid=s.list.reduce((a,p)=>a+p.paid,0);
    s.balance=s.total-s.paid;
    s.qty=s.list.reduce((a,p)=>a+p.items.reduce((x,it)=>x+it.q,0),0);
    s.last=s.list.length?s.list[s.list.length-1].date:"";
    return s;
  }).sort((a,b)=>a.name.localeCompare(b.name));
}
function spList(){const q=spKey(SP.q);return spPeople().filter(s=>!q||s.name.toLowerCase().includes(q))}
function spInvHtml(s){
  return s.list.map(p=>`<div class="card" style="margin:10px 0 0;padding:12px">
    <div class="row" style="justify-content:space-between;margin:0"><b>Invoice ${esc(p.inv||"(no number)")}</b><span class="mut">${esc(p.date||"-")}</span></div>
    <div class="scroll"><table style="min-width:520px"><tr><th>Product</th><th>Size</th><th>Colour</th><th>Qty</th><th>Unit cost</th><th>Line total</th></tr>${p.items.map(it=>`<tr><td>${esc(it.name)}</td><td>${esc(it.s||"-")}</td><td>${esc(it.c||"-")}</td><td>${it.q}</td><td>${rs(it.cost)}</td><td>${rs(it.q*it.cost)}</td></tr>`).join("")}</table></div>
    <div class="row" style="margin:8px 0 0;gap:14px"><span>Invoice total <b>${rs(p.total)}</b></span><span>Paid <b>${rs(p.paid)}</b></span><span>Owed <b>${rs(p.total-p.paid)}</b></span><span class="mut">Owed to supplier after this invoice: ${pSgn(p.bal)}</span><span style="flex:1"></span><button class="btn alt sm" onclick="spDel('${p.id}')">Delete invoice</button></div>
  </div>`).join("");
}
function spCards(L){
  if(!L.length)return '<p class="mut">No suppliers found.</p>';
  return `<div class="grid">${L.map(s=>{const k=ek(s.key),on=SP.sel.includes(s.key);return `<div class="card" style="margin:0;display:flex;flex-direction:column;gap:6px">
    <div class="row" style="margin:0;justify-content:space-between;flex-wrap:nowrap"><label class="row" style="margin:0;gap:8px;min-width:0;cursor:pointer"><input type="checkbox" style="width:18px;height:18px;flex:none" ${on?"checked":""} onchange="spTog('${k}',this.checked)"><b style="overflow-wrap:anywhere">${esc(s.name)}</b></label><span class="tag">${s.list.length} invoice${s.list.length==1?"":"s"}</span></div>
    <div class="mut">Last invoice: ${esc(s.last||"-")} · ${s.qty} items received</div>
    <div class="row" style="margin:0;gap:14px"><span>Total <b>${rs(s.total)}</b></span><span>Paid <b>${rs(s.paid)}</b></span></div>
    <div><span class="tag acc">Owed to supplier ${pSgn(s.balance)}</span></div>
    <div class="row" style="margin:6px 0 0"><button class="btn sm" onclick="spView('${k}')">View report</button><button class="btn alt sm" onclick="suppPdf('one','${k}')">Download PDF</button></div>
  </div>`}).join("")}</div>`;
}
V.supp=function(){
  spReadForm();
  const all=spPeople();
  SP.sel=SP.sel.filter(k=>all.some(s=>s.key==k));
  const view=all.find(s=>s.key==SP.view);
  if(SP.view&&!view)SP.view="";
  suppSig=spSig();
  const f=spFormGet(),today=dkey(Date.now());
  const ft=f.items.reduce((a,it)=>a+(+it.q||0)*(+it.cost||0),0);
  const tTot=all.reduce((a,s)=>a+s.total,0),tPaid=all.reduce((a,s)=>a+s.paid,0);
  const names=all.map(s=>`<option value="${esc(s.name)}"></option>`).join("");
  const itemRows=f.items.map((it,i)=>`<div class="row" style="align-items:center">
    <input id="sp_n${i}" placeholder="Product name *" value="${esc(it.name??"")}" style="flex:2;min-width:150px">
    <input id="sp_s${i}" placeholder="Size" value="${esc(it.s??"")}" style="width:80px">

    L.forEach(s=>{chk(6);d.setFontSize(9.5);d.setTextColor(20);d.text(s.name.slice(0,30),15,y);d.text(String(s.list.length),95,y,{align:"right"});d.text(mon(s.total),130,y,{align:"right"});d.text(mon(s.paid),160,y,{align:"right"});d.text(msg(s.balance),195,y,{align:"right"});y+=6});
    const tT=L.reduce((a,s)=>a+s.total,0),tP=L.reduce((a,s)=>a+s.paid,0);

function payCard(){

   <div class="row" style="justify-content:space-between;margin:0"><h3 style="margin:0">Payment · ${esc(o.id)}</h3><button class="btn alt sm" onclick="closePay()">Close</button></div>

   </div>
   ${o.total!=sub?`<p class="mut">Total payable including shipping and discount: ${rs(o.total)}</p>`:""}
   <div class="row"><label>Amount received now (Rs.) <input id="pay_amt" type="number" min="0" value="${rem}" oninput="payCalc()" style="width:160px"></label>
     <label>Method <select id="pay_m">${payOpts().map(m=>`<option ${m==o.method?"selected":""}>${esc(m)}</option>`).join("")}</select></label></div>
   <p class="mut">After this payment: paid <b id="pc_paid">${rs(o.total)}</b> · remaining <b id="pc_rem">${rs(0)}</b></p>

   ${hist.length?`<h3 style="margin-top:14px">Payment history</h3><div class="scroll"><table><tr><th>Receipt</th><th>Date</th><th>Amount</th><th>Method</th><th>Balance after</th><th></th></tr>${hist.map(p=>`<tr><td>${esc(p.no)}</td><td>${esc(p.date)}<br><span class="mut">${esc(p.time)}</span></td><td>${rs(p.amt)}</td><td>${esc(p.method)}</td><td>${rs(Math.max(0,p.total-p.before-p.amt))}</td><td><button class="btn alt sm" onclick="resend('${o.id}','${p.id}','pdf')">PDF</button> <button class="btn sm" onclick="resend('${o.id}','${p.id}','wa')">WhatsApp</button></td></tr>`).join("")}</table></div>`:'<p class="mut" style="margin-top:12px">No payments recorded yet.</p>'}
  </div>`;

function payCalc(){const c=document.getElementById("pay-card");if(!c)return;const paid=+c.dataset.paid,rem=+c.dataset.rem,a=+document.getElementById("pay_amt").value||0;document.getElementById("pc_paid").textContent=rs(paid+a);document.getElementById("pc_rem").textContent=rs(Math.max(0,rem-a))}
function savePay(){
  const o=S.orders.find(x=>x.id==PAY.id);if(!o)return;
  const amt=+document.getElementById("pay_amt").value||0,method=document.getElementById("pay_m").value;
  const before=paidBefore(o),rem=o.total-before;
  if(!(amt>0))return toast("Enter the amount received");
  if(amt>rem+0.001)return toast("Amount is more than the remaining balance ("+rs(Math.max(0,rem))+")");
  const now=new Date(),n=(o.pays||[]).length+1;
  const p={id:"R"+now.getTime(),no:o.id+"-R"+n,amt,method,before,total:o.total,ship:o.ship||0,disc:o.disc||0,code:o.code||"",items:o.items.map(i=>({...i})),cust:o.cust,phone:phoneOf(o),addr:o.addr||"",date:now.toLocaleDateString(),time:now.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})};
  o.pays=[...(o.pays||[]),p];
  o.payStatus=(o.total-before-amt)<=0.001?"Paid":"Partially Paid";
  notify("Payment received for "+o.id+": "+rs(amt));
  save();toast("Payment saved");
  sendReceipt(p,"wa");
  render();
}
function resend(oid,pid,how){const o=S.orders.find(x=>x.id==oid),p=o&&(o.pays||[]).find(x=>x.id==pid);if(!p)return toast("Receipt not found");sendReceipt(p,how)}

  y+=5;d.setTextColor(20);d.setFont("helvetica","bold");d.text("Item",15,y);d.text("Qty",125,y,{align:"right"});d.text("Price",160,y,{align:"right"});d.text("Amount",R,y,{align:"right"});d.line(15,y+2,R,y+2);d.setFont("helvetica","normal");y+=9;
  p.items.forEach(i=>{if(y>240){d.addPage();y=20}d.setTextColor(20);d.text(String(i.name),15,y);d.setTextColor(110);d.setFontSize(9);d.text(i.s+" / "+i.c,15,y+4.5);d.setFontSize(10);d.setTextColor(20);
    d.text(String(i.n),125,y,{align:"right"});d.text(mon(i.price||0),160,y,{align:"right"});d.text(mon((i.price||0)*i.n),R,y,{align:"right"});y+=11;d.line(15,y-5,R,y-5)});

function sendReceipt(p,how){
  if(!window.jspdf)return toast("The PDF tool is still loading. Try again in a moment.");

  }

let updFile=null,updAll=false;
function updOk(c){const n=waNum(c.phone);return n.length>=10&&n.length<=15}
function updWhy(c){if(!String(c.phone||"").trim())return "No phone number. Add one in Customers.";if(!updOk(c))return "Number looks wrong. Check it in Customers.";return ""}
V.upd=function(){
 const sent=S.updSent||{};
 const all=S.customers;
 const ok=all.filter(c=>updOk(c)&&updTarget(c));
 const notSent=ok.filter(c=>!sent[c.id]);
 const canPhoto=!!updFile;
 const rowsH=all.map((c,k)=>{
  const why=updWhy(c);
  let status;
  if(why)status='<span class="tag bad">'+esc(why)+'</span>';
  else if(sent[c.id])status='<span class="tag ok">Sent '+esc(sent[c.id])+'</span>';
  else status='<span class="tag">Not sent</span>';
  const actions=why?'<span class="mut">-</span>':
   ((canPhoto?'<button class="btn sm alt" onclick="updShare('+c.id+')">Share photo</button> ':'')+
   '<button class="btn sm" onclick="updSend('+c.id+')">Send on WhatsApp</button> '+
   (sent[c.id]?'<button class="btn sm alt" onclick="updUnmark('+c.id+')">Unmark</button>':''));
  return '<tr><td style="text-align:center">'+(k+1)+'</td><td>'+esc(c.name||"-")+'</td><td>'+esc(c.phone||"-")+'</td><td style="text-align:center">'+status+'</td><td style="text-align:right;white-space:nowrap">'+actions+'</td></tr>';
 }).join("");
 return '<div class="card"><h3>Send update to customers</h3>'+
  '<p class="mut">Write your update once, then send it. Use {name} to insert each customer\'s name. Only send to customers who agreed to receive updates.</p>'+
  '<textarea id="upd_msg" rows="5" style="width:100%;border-radius:10px;padding:9px 12px;background:var(--bg);color:var(--ink);border:1px solid var(--line)" oninput="S.updMsg=this.value;save()" placeholder="e.g. Hi {name}, new Jogger Pants just arrived in 6 colours!">'+esc(S.updMsg||"")+'</textarea>'+
  '<div class="row" style="margin-top:10px"><label class="mut">Photo (optional): <input type="file" accept="image/*" onchange="updPick(this)"></label>'+
  (canPhoto?'<span class="mut">'+esc(updFile.name)+'</span> <button class="btn alt sm" onclick="updClearPhoto()">Remove photo</button>':'')+'</div>'+
  '<div class="row" style="margin-top:8px">'+updTagSelect()+'<button class="btn" onclick="updToggleAll()">'+(updAll?'Hide customer list':'Send to every customer')+'</button><button class="btn alt" onclick="updMarkAll()">Mark all as sent</button><span style="flex:1"></span><button class="btn alt sm" onclick="updReset()">Clear sent list</button></div>'+
  '<p class="mut" style="margin:8px 0 0">Total: '+all.length+' · Ready to send: '+ok.length+' · Sent: '+(ok.length-notSent.length)+' · Not sent: '+notSent.length+' · Missing or wrong number: '+(all.length-ok.length)+'</p>'+
  '</div>'+
  (updAll?updLinks():'')+
  '<div class="card scroll"><table><thead><tr><th style="width:6%">No.</th><th style="text-align:left">Name</th><th style="text-align:left">WhatsApp</th><th style="width:24%;text-align:center">Status</th><th style="width:34%;text-align:right">Action</th></tr></thead><tbody>'+
  (rowsH||'<tr><td colspan="5" class="mut">No customers yet. Add them in Customers.</td></tr>')+
  '</tbody></table></div>';
};
function updPick(input){updFile=(input.files&&input.files[0])||null;render()}
function updClearPhoto(){updFile=null;render()}
function updSend(id){
 const c=S.customers.find(x=>x.id==id);if(!c)return;
 const m=(S.updMsg||"").trim();if(!m)return toast("Write the update message first");
 const text=m.replace(/\{name\}/g,c.name||"");
 const w=window.open("https://wa.me/"+waNum(c.phone)+"?text="+encodeURIComponent(text),"_blank");
 if(!w)return toast("Pop-up blocked. Allow pop-ups for this page and try again.");
 S.updSent=S.updSent||{};S.updSent[id]=new Date().toLocaleDateString();save();render();
}
function updUnmark(id){if(S.updSent)delete S.updSent[id];save();render()}
function updReset(){if(!confirm("Clear the sent list so everyone shows Not sent?"))return;S.updSent={};save();render()}
function updToggleAll(){updAll=!updAll;render()}
function updLinks(){
 const m=(S.updMsg||"").trim();
 if(!m)return '<div class="card"><p class="mut">Write the update message first, then tap a name below.</p></div>';
 const rowsL=S.customers.filter(updTarget).map(c=>{
  const why=updWhy(c);
  if(why)return '<div class="row"><span class="btn sm alt" style="opacity:.5;cursor:default">'+esc(c.name||"-")+'</span><span class="tag bad">'+esc(why)+'</span></div>';
  const t=m.replace(/\{name\}/g,c.name||"");const done=(S.updSent||{})[c.id];
  return '<div class="row"><a class="btn sm'+(done?' alt':'')+'" href="https://wa.me/'+waNum(c.phone)+'?text='+encodeURIComponent(t)+'" target="_blank" rel="noopener" onclick="updMarkSent('+c.id+',this)">'+esc(c.name||c.phone)+'</a><span class="mut">'+(done?'Sent '+esc(done):'Not sent')+'</span></div>';
 }).join("");
 return '<div class="card"><h3>Send to every customer</h3><p class="mut">Tap a name. WhatsApp opens with the message ready; press Send there, then come back and tap the next name. Customers with a reason shown in red cannot be sent to until that is fixed.</p>'+(rowsL||'<p class="mut">No customers yet.</p>')+'</div>';

function updMarkSent(id,el){const d=new Date().toLocaleDateString();S.updSent=S.updSent||{};S.updSent[id]=d;save();if(el){el.classList.add("alt");if(el.nextElementSibling)el.nextElementSibling.textContent="Sent "+d}}
async function updShare(id){
 const c=S.customers.find(x=>x.id==id);if(!c||!updFile)return;
 const text=(S.updMsg||"").trim().replace(/\{name\}/g,c.name||"");
 const f=new File([updFile],updFile.name,{type:updFile.type});
 if(!navigator.canShare||!navigator.canShare({files:[f]}))return toast("Photo sharing works on a phone. On a computer, attach the photo in WhatsApp Web.");
 try{await navigator.share({files:[f],text:text,title:"Update"});S.updSent=S.updSent||{};S.updSent[id]=new Date().toLocaleDateString();save();render()}
 catch(e){if(!e||e.name!="AbortError")toast("Could not share the photo.")}
}
function updNext(){const sent=S.updSent||{};const next=S.customers.find(c=>waNum(c.phone)&&!sent[c.id]);if(!next)return toast("Everyone has been sent the update");updSend(next.id)}
function updMarkAll(){if(!confirm("Mark every customer as sent without sending?"))return;S.updSent=S.updSent||{};const d=new Date().toLocaleDateString();S.customers.forEach(c=>{if(waNum(c.phone))S.updSent[c.id]=d});save();render()}

/* ===== Activity log ===== */
function snapOf(){const p={},o={};(S.products||[]).forEach(x=>{p[x.id]={name:x.name,price:x.price,v:x.v||[]}});(S.orders||[]).forEach(x=>{o[x.id]={cust:x.cust,st:x.status,pay:x.payStatus,tot:x.total,paid:x.paid}});return {p,o}}
function addLog(msg){S.log=S.log||[];S.log.unshift({ts:Date.now(),who:(me&&me.name)||"Owner",what:msg});if(S.log.length>500)S.log.length=500}
function diffLog(){try{const n=snapOf();if(!snap){snap=n;return}
 const a=snap.p,b=n.p;
 Object.keys(b).forEach(id=>{const x=b[id];if(!a[id]){addLog("Added product "+x.name);return}
  if(a[id].price!=x.price)addLog("Changed price of "+x.name+" from "+rs(a[id].price)+" to "+rs(x.price));
  const q=v=>{const m={};(v||[]).forEach(z=>m[z.s+" / "+z.c]=z.q);return m};const qa=q(a[id].v),qb=q(x.v);
  new Set([...Object.keys(qa),...Object.keys(qb)]).forEach(k=>{if(qa[k]!==qb[k])addLog("Changed stock of "+x.name+" ("+k+") from "+(qa[k]??0)+" to "+(qb[k]??0))});
 });
 Object.keys(a).forEach(id=>{if(!b[id])addLog("Removed product "+a[id].name)});
 const oa=snap.o,ob=n.o;
 Object.keys(ob).forEach(id=>{const x=ob[id],y=oa[id];
  if(!y){addLog("New order "+id+" for "+(x.cust||"-")+" ("+rs(x.tot)+")");return}
  if(y.st!==x.st)addLog("Order "+id+" status changed from "+(y.st||"-")+" to "+(x.st||"-"));
  if(y.pay!==x.pay)addLog("Order "+id+" payment changed from "+(y.pay||"-")+" to "+(x.pay||"-"));
  if(y.tot!==x.tot)addLog("Order "+id+" total changed from "+rs(y.tot)+" to "+rs(x.tot));
  if(y.paid!==x.paid)addLog("Order "+id+" amount paid changed from "+rs(y.paid)+" to "+rs(x.paid));
 });
 snap=n}catch(e){}}

 return '<div class="card scroll"><h3>Activity log</h3><p class="mut">Records who changed prices, stock, orders and staff, and when. Newest first.</p><table><thead><tr><th style="text-align:left">When</th><th style="text-align:left">Who</th><th style="text-align:left">What</th></tr></thead><tbody>'+(rows||'<tr><td colspan="3" class="mut">No changes yet.</td></tr>')+'</tbody></table></div>';

function priceListPdf(){
 if(!window.jspdf)return toast("The PDF tool is still loading. Try again in a moment.");
 const disc=Math.max(0,Math.min(90,+document.getElementById("pl_d").value||0));const withSizes=document.getElementById("pl_s").checked;
 const {jsPDF}=window.jspdf,d=new jsPDF({unit:"mm",format:"a4"}),sh=S.shop||{name:"LEUCO JUBATUS"};
 const mon=n=>"Rs. "+Number(n||0).toLocaleString("en-US");
 let y=20;
 d.setFont("helvetica","bold");d.setFontSize(18);d.setTextColor(17);d.text(String(sh.name||"LEUCO JUBATUS"),15,y);y+=7;
 d.setFont("helvetica","normal");d.setFontSize(9);d.setTextColor(90);d.text("PRICE LIST  |  "+new Date().toLocaleDateString(),15,y);y+=8;
 const cats={};S.products.forEach(p=>{const c=p.cat||"General";(cats[c]=cats[c]||[]).push(p)});
 Object.keys(cats).sort().forEach(cat=>{
  if(y>262){d.addPage();y=20}
  d.setFont("helvetica","bold");d.setFontSize(11);d.setTextColor(17);d.text(cat.toUpperCase(),15,y);y+=2;d.setDrawColor(150);d.line(15,y,195,y);y+=5;
  d.setFontSize(9);d.setTextColor(90);d.text("PRODUCT",15,y);d.text("RETAIL",140,y,{align:"right"});if(disc)d.text("WHOLESALE",195,y,{align:"right"});y+=5;
  d.setTextColor(17);d.setFont("helvetica","normal");
  cats[cat].forEach(p=>{
   if(y>270){d.addPage();y=20}
   d.text(String(p.name||""),15,y);d.text(mon(p.price),140,y,{align:"right"});if(disc)d.text(mon(Math.round((p.price||0)*(100-disc)/100)),195,y,{align:"right"});y+=5;
   if(withSizes){const sizes=[...new Set((p.v||[]).map(x=>x.s))].join(", ");if(sizes){d.setFontSize(8);d.setTextColor(110);d.text("Sizes: "+sizes,18,y);y+=4;d.setFontSize(9);d.setTextColor(17)}}
  });
  y+=5;
 });
 d.save("price-list-"+dkey(Date.now())+".pdf");
}

 return '<style>.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cd{min-height:84px;border:1px solid var(--line);border-radius:8px;padding:4px;font-size:12px;overflow:hidden}.dn{font-weight:700;color:var(--mut)}.ev{border-radius:4px;padding:1px 4px;margin-top:2px;font-size:11px;background:var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ev.order{background:rgba(63,99,224,.2)}.ev.delivery{background:rgba(47,125,91,.22)}.ev.plan{background:rgba(224,160,40,.28)}</style>'+

};

function loyOf(c){const per=S.loy.per||100;const earned=S.orders.filter(o=>o.cid==c.id&&live(o)).reduce((a,o)=>a+Math.floor((o.total||0)/per),0);const redeemed=c.redeemed||0;return {earned,redeemed,bal:earned-redeemed}}
function openHist(id){HISTC=id;render()}
function histPanel(){const c=S.customers.find(x=>x.id==HISTC);if(!c)return "";
 const ly=loyOf(c);const hist=(c.hist||[]).slice().reverse();const gifts=S.gift.filter(g=>g.cid==c.id);
 const fits=(c.hist||[]).filter(h=>h.t=="Fit rating").map(h=>+h.x).filter(n=>n>=1&&n<=5);
 const avg=fits.length?(fits.reduce((a,b)=>a+b,0)/fits.length).toFixed(1):"-";
 return '<div class="card"><h3>History: '+esc(c.name)+'</h3>'+
  '<p class="mut">Points: earned '+ly.earned+' · redeemed '+ly.redeemed+' · balance <b>'+ly.bal+'</b>. Earned automatically: 1 point per '+rs(S.loy.per)+' spent; 1 point = '+rs(S.loy.value)+' off. Average fit rating: '+avg+' ('+fits.length+' answers)</p>'+
  '<div class="row"><input id="rd_pts" type="number" min="1" placeholder="Points to redeem" style="width:180px"><button class="btn sm" onclick="redeemPts('+c.id+')">Create points voucher</button></div>'+
  '<div class="row" style="margin-top:8px"><select id="hi_t"><option>Call</option><option>Message</option><option>Complaint</option><option>Note</option><option>Fit rating</option></select><input id="hi_x" placeholder="Details (for Fit rating, enter 1 to 5)" style="flex:1;min-width:240px"><button class="btn sm" onclick="histAdd('+c.id+')">Add entry</button><button class="btn alt sm" onclick="openHist(0)">Close</button></div>'+
  '<div class="scroll"><table><tr><th style="text-align:left">Date</th><th style="text-align:left">Type</th><th style="text-align:left">Details</th></tr>'+(hist.map(h=>'<tr><td>'+esc(h.d)+'</td><td>'+esc(h.t)+'</td><td>'+esc(h.x)+'</td></tr>').join("")||'<tr><td colspan="3" class="mut">No entries yet.</td></tr>')+'</table></div>'+
  (gifts.length?'<p class="mut" style="margin-top:8px">Vouchers: '+gifts.map(g=>esc(g.code)+' ('+rs(g.balance)+' left)').join(", ")+'</p>':'')+'</div>';
}
function histAdd(id){const c=S.customers.find(x=>x.id==id);if(!c)return;const t=document.getElementById("hi_t").value,x=document.getElementById("hi_x").value.trim();
 if(!x)return toast("Write the details first");
 if(t=="Fit rating"&&!(+x>=1&&+x<=5))return toast("Fit rating must be a number from 1 to 5");
 c.hist=c.hist||[];c.hist.push({d:new Date().toLocaleDateString(),t:t,x:x});save();toast("Entry added");render()}
function redeemPts(id){const c=S.customers.find(x=>x.id==id);if(!c)return;const p=Math.floor(+document.getElementById("rd_pts").value||0);const ly=loyOf(c);
 if(p<1||p>ly.bal)return toast("Enter between 1 and "+ly.bal+" points");
 const v=p*(S.loy.value||1);c.redeemed=(c.redeemed||0)+p;const g=giftNew(id,"points",v,c.name,c.phone);
 c.hist=c.hist||[];c.hist.push({d:new Date().toLocaleDateString(),t:"Points",x:p+" points redeemed for a "+rs(v)+" voucher ("+g.code+")"});save();toast("Voucher "+g.code+" created");render()}
function custSurvey(id){const c=S.customers.find(x=>x.id==id);if(!c)return;if(!waNum(c.phone))return toast("This customer has no phone number");
 const text="Hi "+(c.name||"")+", thank you for your order with "+((S.shop||{}).name||"LEUCO JUBATUS")+"! How did your pants fit? Please reply with a number:\n1 = too small\n2 = a little small\n3 = perfect\n4 = a little big\n5 = too big";
 const w=window.open("https://wa.me/"+waNum(c.phone)+"?text="+encodeURIComponent(text),"_blank");if(!w)return toast("Pop-up blocked. Allow pop-ups and try again.");
 c.hist=c.hist||[];c.hist.push({d:new Date().toLocaleDateString(),t:"Survey",x:"Fit survey sent"});save();render()}

function genCode(){const ch="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<6;i++)s+=ch[Math.floor(Math.random()*ch.length)];return "LJ-"+s}
function giftNew(cid,type,value,to,phone){let code;do{code=genCode()}while(S.gift.some(g=>g.code==code));
 const g={id:Date.now(),code,type,value,balance:value,to:to||"",phone:phone||"",cid:cid||0,created:new Date().toLocaleDateString()};
 S.gift.push(g);addLog((type=="points"?"Points voucher ":"Gift card ")+code+" created for "+rs(value));save();return g}
function giftCreate(){const v=+document.getElementById("gv").value,to=document.getElementById("gto").value.trim(),ph=document.getElementById("gph").value.trim();
 if(!(v>0))return toast("Enter a value greater than 0");giftNew(0,"gift",v,to,ph);toast("Gift card created");render()}
function giftUse(id){const g=S.gift.find(x=>x.id==id);if(!g)return;const v=+prompt("Amount used from "+g.code+" (balance "+rs(g.balance)+")");
 if(!(v>0)||v>g.balance)return toast("Enter an amount from 1 to "+g.balance);g.balance-=v;addLog("Used "+rs(v)+" from "+g.code+" (left "+rs(g.balance)+")");save();render()}
function giftDel(id){const g=S.gift.find(x=>x.id==id);if(!g||!confirm("Delete code "+g.code+"?"))return;S.gift=S.gift.filter(x=>x.id!=id);addLog("Deleted code "+g.code);save();render()}
function loySave(){const per=+document.getElementById("lp").value,val=+document.getElementById("lv").value;if(!(per>0)||!(val>0))return toast("Enter numbers greater than 0");S.loy={per,value:val};addLog("Loyalty settings: 1 point per "+rs(per)+", 1 point = "+rs(val));save();toast("Settings saved");render()}

function giftLoadImg(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
async function giftCanvas(g){const W=1200,H=700,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d"),sh=S.shop||{},F='"Inter","Segoe UI",Arial,sans-serif';
 const rr=(a,b,w,h,r)=>{x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()};
 const sp=(n)=>{try{x.letterSpacing=n+"px"}catch(e){}};
 x.fillStyle="#fff";x.fillRect(0,0,W,H);
 rr(0,0,W,H,40);x.save();x.clip();
 let bg=x.createLinearGradient(0,0,W,H);bg.addColorStop(0,"#121010");bg.addColorStop(1,"#2a2018");x.fillStyle=bg;x.fillRect(0,0,W,H);
 let cg=x.createRadialGradient(W-120,80,10,W-120,80,520);cg.addColorStop(0,"rgba(196,118,66,.75)");cg.addColorStop(1,"rgba(196,118,66,0)");x.fillStyle=cg;x.fillRect(0,0,W,H);
 x.strokeStyle="rgba(255,255,255,.07)";x.lineWidth=2;for(let i=0;i<4;i++){x.beginPath();x.arc(W-60,H+40,180+i*90,0,Math.PI*2);x.stroke()}
 x.restore();
 const lg=await giftLoadImg(LOGO);
 if(lg){x.save();rr(70,60,110,110,22);x.fillStyle="#fff";x.fill();x.clip();x.drawImage(lg,74,64,102,102);x.restore()}
 x.fillStyle="#f4ede2";x.textBaseline="alphabetic";x.font="400 34px "+F;sp(7);x.fillText(String(sh.name||"LEUCO JUBATUS").toUpperCase(),205,108);
 x.fillStyle="#d89a6c";x.font="600 22px "+F;sp(8);x.fillText(g.type=="points"?"POINTS VOUCHER":"GIFT CARD",207,152);
 sp(0);x.fillStyle="#a89f90";x.font="500 24px "+F;x.fillText(g.type=="points"?"Voucher value":(g.balance<g.value?"Balance":"Value"),70,300);
 x.fillStyle="#fffaf0";x.font="700 112px "+F;x.fillText(rs(g.balance),66,410);
 if(g.balance<g.value){x.fillStyle="#a89f90";x.font="500 24px "+F;x.fillText("of "+rs(g.value),70,452)}
 if(g.to){x.fillStyle="#a89f90";x.font="500 24px "+F;x.fillText("For",70,498);x.fillStyle="#f4ede2";x.font="600 34px "+F;x.fillText(String(g.to),130,500)}
 x.save();rr(70,540,520,92,18);x.fillStyle="rgba(255,255,255,.08)";x.fill();x.setLineDash([10,8]);x.strokeStyle="#d89a6c";x.lineWidth=2.5;x.stroke();x.restore();
 x.fillStyle="#a89f90";x.font="500 18px "+F;sp(4);x.fillText("CODE",96,574);
 x.fillStyle="#fffaf0";x.font="700 40px 'Courier New',monospace";sp(6);x.fillText(g.code,96,616);sp(0);
 x.textAlign="right";x.fillStyle="#a89f90";x.font="500 22px "+F;
 const L=["Show this code when you order","Issued "+g.created,[sh.phone,sh.email].filter(Boolean).join("   ")].filter(Boolean);
 L.forEach((t,i)=>x.fillText(t,W-70,H-120+i*34));x.textAlign="left";
 return c}
function giftFile(g){return "gift-card-"+g.code+".png"}
async function giftView(id){const g=S.gift.find(z=>z.id==id);if(!g)return;const c=await giftCanvas(g),u=c.toDataURL("image/png");
 let o=document.getElementById("gvw");if(o)o.remove();o=document.createElement("div");o.id="gvw";o.setAttribute("role","dialog");o.setAttribute("aria-label","Gift card image");
 o.style.cssText="position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px";
 o.innerHTML=`<div class="card" style="max-width:720px;width:100%;margin:0;max-height:100%;overflow:auto"><img id="gimg" src="${u}" alt="Gift card ${esc(g.code)}" style="width:100%;border-radius:18px;display:block"><p class="mut" style="margin:10px 0 0;font-size:13px">${g.phone?"Customer number: "+esc(g.phone)+". ":""}WhatsApp cannot attach a picture by itself, so the image is saved first and the chat opens with the message ready. Tap attach and pick the image.</p><div class="row" style="margin-top:8px"><button class="btn" onclick="giftWA(${g.id})">Send on WhatsApp</button><button class="btn alt" onclick="giftShare(${g.id})">Share image</button><button class="btn alt" onclick="giftSave(${g.id})">Download</button><button class="btn alt" onclick="giftPrint()">Print</button><button class="btn alt" style="margin-left:auto" onclick="giftClose()">Close</button></div></div>`;
 o.onclick=e=>{if(e.target==o)giftClose()};document.body.appendChild(o)}

async function giftBlob(g){const c=await giftCanvas(g);return new Promise(r=>c.toBlob(r,"image/png"))}
async function giftSave(id,quiet){const g=S.gift.find(z=>z.id==id);if(!g)return false;const b=await giftBlob(g);if(!b){toast("Could not make the image. Try again.");return false}
 try{const dl=window.claude&&claude.use?await claude.use("downloads"):null;if(dl){await dl.save({filename:giftFile(g),data:b});if(!quiet)toast("Image saved");return true}}catch(e){if(e&&e.code=="declined")return false}
 const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=giftFile(g);document.body.appendChild(a);a.click();a.remove();if(!quiet)toast("Image downloaded. If nothing saved, open the page in its own tab.");return true}
async function giftWA(id){const g=S.gift.find(z=>z.id==id);if(!g)return;
 let ph=g.phone||((S.customers.find(c=>c.id==g.cid)||{}).phone)||"";
 if(!ph){ph=(prompt("Customer WhatsApp number (for example 0771234567)")||"").trim();if(!ph)return;g.phone=ph;save()}
 const ok=await giftSave(id,true);if(!ok)return;
 const w=window.open("https://wa.me/"+waNum(ph)+"?text="+encodeURIComponent(giftMsg(g)),"_blank");
 toast(w?"Image saved. In the chat for "+ph+", tap attach and choose the image.":"Pop-up blocked. Allow pop-ups, then try again.")}
async function giftShare(id){const g=S.gift.find(z=>z.id==id);if(!g)return;const b=await giftBlob(g);if(!b)return toast("Could not make the image. Try again.");
 const f=new File([b],giftFile(g),{type:"image/png"});
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:"Gift card "+g.code,text:giftMsg(g)})}catch(e){if(e&&e.name!="AbortError")toast("Could not share. Use Send on WhatsApp instead.")}}
 else toast("This browser cannot share images. Use Send on WhatsApp instead.")}

let PST={pid:0,tone:"friendly",offer:"",code:"",plat:"Instagram",text:""};
function capText(p,tone,offer,code,plat){
 const name=p.name||"New arrival";const price=rs(p.price);
 const cols=[...new Set((p.v||[]).map(x=>x.c).filter(Boolean))];const sizes=[...new Set((p.v||[]).map(x=>x.s).filter(Boolean))];
 const colTxt=cols.join(", "),sizeTxt=sizes.join(", ");
 const L={
  friendly:[ "New in: "+name, "Fresh colours and a comfortable fit, made for everyday wear.", colTxt?"Colours: "+colTxt:"", sizeTxt?"Sizes: "+sizeTxt:"", "Price: "+price, "Order now and we deliver to your door." ],
  bold:[ name.toUpperCase()+" IS HERE.", "Built to stand out. Limited stock.", colTxt?"Pick your colour: "+colTxt:"", "Price: "+price, "Message us on WhatsApp to order." ],
  short:[ name+" - "+price, colTxt, "Order on WhatsApp." ]
 }[tone]||[];
 const offerTxt=[offer, code?"Use code "+code+" at checkout.":""].filter(Boolean).join(" ");
 const tags=plat=="WhatsApp"?"":"#LEUCOJUBATUS #"+String(p.cat||"Streetwear").replace(/\W/g,"")+" #Streetwear #NewArrival";
 return [L.filter(Boolean).join("\n"),offerTxt,tags].filter(Boolean).join("\n\n");
}

 PST.offer=document.getElementById("po_o").value.trim();PST.code=document.getElementById("po_c").value.trim().toUpperCase();PST.text="";render()}

/* ===== Campaign results ===== */
S.camps=S.camps||[];
let CAMPV=0;
function campSave(){const name=document.getElementById("cp_name").value.trim()||("Update "+new Date().toLocaleDateString());
 const code=document.getElementById("cp_code").value.trim().toUpperCase();const msg=(S.updMsg||"").trim();
 const cids=Object.keys(S.updSent||{}).map(Number);
 if(!cids.length)return toast("Send the update first. Sent customers are saved as recipients.");
 S.camps.unshift({id:Date.now(),name,code,msg,date:new Date().toLocaleDateString(),cids,replied:[]});
 S.updSent={};addLog("Saved campaign "+name+" to "+cids.length+" customers");save();toast("Campaign saved. The Updates sent list is cleared for a new batch.");render()}
function campOpen(id){CAMPV=id;render()}
function campReply(cid,id,on){const c=S.camps.find(x=>x.id==cid);if(!c)return;c.replied=c.replied||[];
 if(on){if(!c.replied.includes(id))c.replied.push(id)}else c.replied=c.replied.filter(x=>x!=id);save();render()}
function campDel(id){const c=S.camps.find(x=>x.id==id);if(!c||!confirm("Delete campaign "+c.name+"?"))return;S.camps=S.camps.filter(x=>x.id!=id);if(CAMPV==id)CAMPV=0;save();render()}
function campStats(c){const ords=c.code?S.orders.filter(o=>live(o)&&o.code==c.code):[];
 return {sent:c.cids.length,replied:(c.replied||[]).length,orders:ords.length,fromRec:ords.filter(o=>c.cids.includes(o.cid)).length,sales:ords.reduce((a,o)=>a+(o.total||0),0)}}
function codeStats(){const m={};S.orders.filter(live).forEach(o=>{if(!o.code)return;const k=o.code;m[k]=m[k]||{n:0,disc:0,sales:0};m[k].n++;m[k].disc+=o.disc||0;m[k].sales+=o.total||0});return m}
function campPanel(c){return '<div class="mut" style="margin-bottom:6px">Tick each customer who replied to this campaign:</div>'+
 c.cids.map(id=>{const cu=S.customers.find(x=>x.id==id);if(!cu)return "";return '<label style="display:block"><input type="checkbox" '+((c.replied||[]).includes(id)?'checked':'')+' onchange="campReply('+c.id+','+id+',this.checked)"> '+esc(cu.name||"-")+' <span class="mut">'+esc(cu.phone||"")+'</span></label>'}).join("")+
 '<button class="btn alt sm" style="margin-top:8px" onclick="campOpen(0)">Close</button>'}
V.camp=function(){
 const msg=(S.updMsg||"").trim();const sentN=Object.keys(S.updSent||{}).length;
 const rows=S.camps.map(c=>{const st=campStats(c);
  return '<tr><td><b>'+esc(c.name)+'</b><br><span class="mut">'+esc(c.date)+'</span></td><td>'+(c.code?'<span class="tag acc">'+esc(c.code)+'</span>':'-')+'</td><td>'+st.sent+'</td><td>'+st.replied+' <button class="btn sm alt" onclick="campOpen('+c.id+')">Mark replies</button></td><td>'+st.orders+' ('+st.fromRec+' from recipients)</td><td>'+rs(st.sales)+'</td><td><button class="btn sm alt" onclick="campDel('+c.id+')">Delete</button></td></tr>'+
  (CAMPV==c.id?'<tr><td colspan="7">'+campPanel(c)+'</td></tr>':'');}).join("");
 const cs=codeStats();
 const crow=Object.keys(cs).sort().map(k=>'<tr><td><b>'+esc(k)+'</b></td><td>'+cs[k].n+'</td><td>'+rs(cs[k].disc)+'</td><td>'+rs(cs[k].sales)+'</td></tr>').join("");
 return '<div class="card"><h3>Save this update as a campaign</h3><p class="mut">Customers marked Sent in the Updates tab become the recipients. WhatsApp does not tell the store when a message is opened or read, so this tracks sends, replies you mark by hand, and orders that use the campaign discount code.</p>'+
  '<div class="row"><input id="cp_name" placeholder="Campaign name, e.g. Jogger Pants launch" style="flex:1;min-width:220px"><input id="cp_code" placeholder="Discount code used (optional)" style="width:220px"><button class="btn" onclick="campSave()">Save campaign ('+sentN+' sent)</button></div>'+
  '<p class="mut">Message: '+(msg?esc(msg.slice(0,140))+(msg.length>140?"…":""):"none written yet")+'</p></div>'+
  '<div class="card scroll"><h3>Campaign results</h3><table><thead><tr><th style="text-align:left">Campaign</th><th style="text-align:left">Code</th><th>Sent</th><th>Replied</th><th>Orders using code</th><th>Sales</th><th></th></tr></thead><tbody>'+(rows||'<tr><td colspan="7" class="mut">No campaigns yet.</td></tr>')+'</tbody></table></div>'+
  '<div class="card scroll"><h3>Discount codes used</h3><table><thead><tr><th style="text-align:left">Code</th><th>Orders</th><th>Discount given</th><th>Sales</th></tr></thead><tbody>'+(crow||'<tr><td colspan="4" class="mut">No orders with codes yet.</td></tr>')+'</tbody></table></div>';
};

/* ===== Wholesale crates and orders ===== */
S.crates=S.crates||[];S.worders=S.worders||[];
const WSTAT=["New","Packed","Delivered"];
function crateAdd(){const name=document.getElementById("cr_n").value.trim(),price=+document.getElementById("cr_p").value,txt=document.getElementById("cr_l").value.trim();
 if(!name)return toast("Name the crate, e.g. Crate A");if(!(price>0))return toast("Enter the crate price");
 const lines=txt.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>l.split(",").map(x=>x.trim()));
 if(!lines.length)return toast("Add the crate contents, one line each");
 const bad=lines.find(a=>a.length<4||!(+a[3]>0));if(bad)return toast("Each line needs: product, colour, size, quantity. Example: Jogger Pants, Black, 32, 2");
 const items=lines.map(a=>({p:a[0],c:a[1],s:a[2],q:+a[3]}));
 const pieces=items.reduce((x,i)=>x+i.q,0);
 S.crates.push({id:Date.now(),name,price,pieces,items});addLog("Wholesale crate "+name+" created ("+pieces+" pieces, "+rs(price)+")");save();toast("Crate saved");render()}
function crateDel(id){const c=S.crates.find(x=>x.id==id);if(!c||!confirm("Delete "+c.name+"? Existing orders keep their details."))return;S.crates=S.crates.filter(x=>x.id!=id);save();render()}
function worderAdd(){const cid=+document.getElementById("wo_c").value,crid=+document.getElementById("wo_cr").value,n=+document.getElementById("wo_n").value,paid=+document.getElementById("wo_pd").value||0,st=document.getElementById("wo_st").value,dt=document.getElementById("wo_d").value;
 const cu=S.customers.find(x=>x.id==cid),cr=S.crates.find(x=>x.id==crid);
 if(!cu)return toast("Choose a wholesale customer");if(!cr)return toast("Create a crate first");if(!(n>0))return toast("Enter how many crates");
 const d=dt?new Date(dt+"T12:00:00"):new Date();
 S.wid=(S.wid||100)+1;const total=n*cr.price;
 S.worders.unshift({id:"WH-"+S.wid,cid,cust:cu.name,phone:cu.phone||"",addr:cu.addr||"",crateId:cr.id,crate:cr.name,price:cr.price,pieces:cr.pieces,items:cr.items,n,total,paid,status:st,date:d.toLocaleDateString()});
 addLog("Wholesale order WH-"+S.wid+" for "+cu.name+": "+n+" x "+cr.name+" ("+rs(total)+")");save();toast("Wholesale order saved");render()}
function worderSet(id,field,val){const o=S.worders.find(x=>x.id==id);if(!o)return;const old=o[field];o[field]=field=="paid"?(+val||0):val;
 if(field=="status"&&old!=val)addLog("Wholesale order "+id+" status: "+old+" to "+val);
 if(field=="paid"&&old!=o.paid)addLog("Wholesale order "+id+" paid changed to "+rs(o.paid));save();render()}
function worderDel(id){const o=S.worders.find(x=>x.id==id);if(!o||!confirm("Delete order "+id+"?"))return;S.worders=S.worders.filter(x=>x.id!=id);addLog("Deleted wholesale order "+id);save();render()}
function whsPackPdf(id){const o=S.worders.find(x=>x.id==id);if(!o)return;if(!window.jspdf)return toast("The PDF tool is still loading. Try again in a moment.");
 const {jsPDF}=window.jspdf,d=new jsPDF({unit:"mm",format:"a4"}),sh=S.shop||{name:"LEUCO JUBATUS"};let y=20;
 d.setFont("helvetica","bold");d.setFontSize(16);d.text("PACKING LIST",15,y);y+=7;
 d.setFont("helvetica","normal");d.setFontSize(10);d.text(String(sh.name||"LEUCO JUBATUS")+"  |  Order "+o.id+"  |  "+o.date,15,y);y+=6;
 d.text("Customer: "+o.cust+"   Crate: "+o.crate+" x "+o.n+" ("+(o.n*o.pieces)+" pieces)",15,y);y+=8;
 d.setFont("helvetica","bold");d.setFontSize(9);d.text("PRODUCT",15,y);d.text("COLOUR",100,y);d.text("SIZE",135,y);d.text("PIECES",165,y,{align:"right"});y+=2;d.line(15,y,195,y);y+=5;
 d.setFont("helvetica","normal");
 (o.items||[]).forEach(i=>{d.text(String(i.p),15,y);d.text(String(i.c),100,y);d.text(String(i.s),135,y);d.text(String(i.q*o.n),165,y,{align:"right"});y+=6});
 y+=2;d.line(15,y,195,y);y+=6;d.setFont("helvetica","bold");d.text("Total pieces: "+(o.n*o.pieces),15,y);y+=10;
 d.setFont("helvetica","normal");d.setFontSize(9);d.text("Packed by: ______________________     Checked by: ______________________",15,y);
 d.save("packing-list-"+o.id+".pdf")}
function whsBillPdf(id){const o=S.worders.find(x=>x.id==id);if(!o)return;if(!window.jspdf)return toast("The PDF tool is still loading. Try again in a moment.");
 const {jsPDF}=window.jspdf,d=new jsPDF({unit:"mm",format:"a4"}),sh=S.shop||{name:"LEUCO JUBATUS"};const mon=n=>rs(n);let y=20;
 d.setFont("helvetica","bold");d.setFontSize(18);d.text(String(sh.name||"LEUCO JUBATUS"),15,y);y+=7;
 d.setFont("helvetica","normal");d.setFontSize(9);d.setTextColor(90);d.text(String(sh.phone||"")+"  "+String(sh.email||""),15,y);y+=10;
 d.setTextColor(17);d.setFont("helvetica","bold");d.setFontSize(14);d.text("WHOLESALE BILL",15,y);d.setFontSize(10);d.text("Bill no. "+o.id,195,y,{align:"right"});y+=7;
 d.setFont("helvetica","normal");d.setFontSize(10);d.text("Date: "+o.date,15,y);y+=6;
 d.text("Bill to: "+o.cust,15,y);y+=5;if(o.phone){d.text("Phone: "+o.phone,15,y);y+=5}if(o.addr){d.text("Address: "+o.addr,15,y);y+=5}
 y+=5;d.setFont("helvetica","bold");d.setFontSize(9);d.text("CRATE",15,y);d.text("CRATES",120,y,{align:"right"});d.text("PRICE / CRATE",160,y,{align:"right"});d.text("TOTAL",195,y,{align:"right"});y+=2;d.line(15,y,195,y);y+=6;
 d.setFont("helvetica","normal");d.text(o.crate+" ("+o.pieces+" pieces)",15,y);d.text(String(o.n),120,y,{align:"right"});d.text(mon(o.price),160,y,{align:"right"});d.text(mon(o.total),195,y,{align:"right"});y+=10;
 d.line(120,y,195,y);y+=6;d.setFont("helvetica","bold");
 d.text("Total",120,y);d.text(mon(o.total),195,y,{align:"right"});y+=6;
 d.setFont("helvetica","normal");d.text("Paid",120,y);d.text(mon(o.paid||0),195,y,{align:"right"});y+=6;
 d.setFont("helvetica","bold");d.text("Balance due",120,y);d.text(mon(Math.max(0,o.total-(o.paid||0))),195,y,{align:"right"});y+=12;
 d.setFont("helvetica","normal");d.setFontSize(9);d.text("Thank you for your wholesale order.",15,y);
 d.save("wholesale-bill-"+o.id+".pdf")}
function crateOffer(){const shop=(S.shop||{}).name||"LEUCO JUBATUS";
 const lines=S.crates.map(c=>"- "+c.name+": "+c.pieces+" pieces for "+rs(c.price)+" per crate");
 if(!lines.length)return toast("Create a crate first");
 S.updMsg="Hi {name}, wholesale crate offer from "+shop+":\n\n"+lines.join("\n")+"\n\nReply to order. We deliver island-wide.";
 updTagF="Wholesale";tab="upd";save();render();scrollTo(0,0)}
V.whs=function(){
 const wc=S.customers.filter(c=>(c.tags||[]).includes("Wholesale"));
 const crates=S.crates.map(c=>'<tr><td><b>'+esc(c.name)+'</b></td><td>'+c.pieces+' pieces</td><td>'+rs(c.price)+'</td><td class="mut">'+c.items.map(i=>esc(i.p)+" "+esc(i.c)+" "+esc(i.s)+" x"+i.q).join("<br>")+'</td><td style="text-align:right"><button class="btn sm alt" onclick="crateDel('+c.id+')">Delete</button></td></tr>').join("");
 const orders=S.worders.map(o=>'<tr><td><b>'+esc(o.id)+'</b><br><span class="mut">'+esc(o.date)+'</span></td><td>'+esc(o.cust)+'</td><td>'+esc(o.crate)+' x '+o.n+'</td><td>'+rs(o.total)+'</td><td><input type="number" value="'+(o.paid||0)+'" style="width:110px" onchange="worderSet(\''+o.id+'\',\'paid\',this.value)"><br><span class="mut">Balance '+rs(Math.max(0,o.total-(o.paid||0)))+'</span></td><td><select onchange="worderSet(\''+o.id+'\',\'status\',this.value)">'+WSTAT.map(x=>'<option'+(o.status==x?' selected':'')+'>'+x+'</option>').join("")+'</select></td><td style="text-align:right;white-space:nowrap"><button class="btn sm alt" onclick="whsPackPdf(\''+o.id+'\')">Packing list</button> <button class="btn sm alt" onclick="whsBillPdf(\''+o.id+'\')">Bill PDF</button> <button class="btn sm alt" onclick="worderDel(\''+o.id+'\')">Delete</button></td></tr>').join("");
 return '<div class="card"><h3>Wholesale crates</h3><p class="mut">Describe a crate, one item per line: product, colour, size, quantity. Example line: Jogger Pants, Black, 32, 2</p>'+
  '<div class="row"><input id="cr_n" placeholder="Crate name, e.g. Crate A" style="width:200px"><input id="cr_p" type="number" placeholder="Crate price (Rs)" style="width:180px"></div>'+
  '<textarea id="cr_l" rows="5" style="width:100%;border-radius:10px;padding:9px 12px;background:var(--bg);color:var(--ink);border:1px solid var(--line)" placeholder="Jogger Pants, Black, 32, 2&#10;Jogger Pants, Navy, 30, 3"></textarea>'+
  '<div class="row" style="margin-top:8px"><button class="btn" onclick="crateAdd()">Save crate</button></div></div>'+
  '<div class="card scroll"><div class="row"><h3 style="margin:0;flex:1">Crate list</h3><button class="btn" onclick="crateOffer()">Send crate offer to wholesale customers</button></div><table style="margin-top:8px"><thead><tr><th style="text-align:left">Crate</th><th style="text-align:left">Pieces</th><th style="text-align:left">Price</th><th style="text-align:left">Contents</th><th></th></tr></thead><tbody>'+(crates||'<tr><td colspan="5" class="mut">No crates yet.</td></tr>')+'</tbody></table></div>'+
  '<div class="card"><h3>New wholesale order</h3>'+(wc.length?'':'<p class="mut">No customers tagged Wholesale yet. Tag them on the Customers tab first.</p>')+
  '<div class="row"><select id="wo_c">'+wc.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join("")+'</select><select id="wo_cr">'+S.crates.map(c=>'<option value="'+c.id+'">'+esc(c.name)+' ('+rs(c.price)+')</option>').join("")+'</select><input id="wo_n" type="number" min="1" placeholder="Crates" style="width:110px"><input id="wo_pd" type="number" placeholder="Paid so far (Rs)" style="width:160px"><select id="wo_st">'+WSTAT.map(x=>'<option>'+x+'</option>').join("")+'</select><input id="wo_d" type="date"><button class="btn" onclick="worderAdd()">Add order</button></div></div>'+
  '<div class="card scroll"><h3>Wholesale orders</h3><table><thead><tr><th style="text-align:left">Order</th><th style="text-align:left">Customer</th><th style="text-align:left">Crates</th><th style="text-align:left">Total</th><th style="text-align:left">Paid</th><th style="text-align:left">Status</th><th></th></tr></thead><tbody>'+(orders||'<tr><td colspan="7" class="mut">No wholesale orders yet.</td></tr>')+'</tbody></table></div>';
};

render();
</script>
</body></html>
